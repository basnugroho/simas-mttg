services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: simas-mttg-prod
    container_name: simas-mttg-prod
    ports:
      # Host port configurable via `APP_HOST_PORT` in `larapp/.env.prod` (default 8090)
      - "${APP_HOST_PORT:-8090}:80"
    env_file:
      - ./larapp/.env.prod
    depends_on:
      - db
    volumes:
      - /mnt/data/simas-mttg-uploads:/var/www/html/storage/app/public
    restart: unless-stopped


  db:
    image: mysql:8.0
    container_name: simas-mttg-db-prod
    restart: unless-stopped
    env_file:
      - ./larapp/.env.prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - db_data_prod:/var/lib/mysql

volumes:
  db_data_prod: